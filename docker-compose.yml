services:
  app:
    build: .
    container_name: lays_rating_app
    image: lays_rating_app
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "8053:8053"
    environment:
      # ===== Секреты =====
      SECRET_KEY: "change-me-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "43200"  # 30 дней

      # ===== БД =====
      DATABASE_URL: "sqlite:////app/data/lays_rating.db"

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8053/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s